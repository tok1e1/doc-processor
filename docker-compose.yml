services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: docs
      POSTGRES_PASSWORD: docs
      POSTGRES_DB: docs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docs -d docs"]
      interval: 2s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: .
    image: doc-processor:local
    entrypoint: ["/app/api"]
    environment: &app-env
      POSTGRES_DSN: postgres://docs:docs@postgres:5432/docs?sslmode=disable
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      STORAGE_DIR: /data/documents
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    volumes:
      - documents:/data/documents
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build: .
    image: doc-processor:local
    entrypoint: ["/app/worker"]
    environment:
      <<: *app-env
      WORKER_CONCURRENCY: "8"
    volumes:
      - documents:/data/documents
    deploy:
      replicas: 2
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports:
      - "9091:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
      - worker

volumes:
  pgdata:
  documents:
